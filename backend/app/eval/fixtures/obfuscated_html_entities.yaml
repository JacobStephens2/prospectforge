name: obfuscated_html_entities
description: |
  Synthetic fixture exercising the HTML-entity-encoded email case
  (`&#64;` and `&#46;`) that trafilatura sometimes leaves un-decoded
  in extracted text. deobfuscate_text now html.unescape()s before
  the regex pre-pass runs.
source_url: https://example-academy.test/contact
